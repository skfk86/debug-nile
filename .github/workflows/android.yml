name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Patch native project (optional hook)
        run: |
          if [ -f scripts/patch_android.sh ]; then bash scripts/patch_android.sh; else echo "no scripts/patch_android.sh"; fi

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Set version
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) VERSION_NAME="$(node -p "require('./package.json').version")" ;;
          esac
          python3 scripts/set_android_version.py --code "$GITHUB_RUN_NUMBER" --name "$VERSION_NAME" --gradle android/app/build.gradle

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release (unsigned)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign release APK and AAB
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          OUT="$GITHUB_WORKSPACE/release-out"
          mkdir -p "$OUT"
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)"
          "$BT/zipalign" -p -f 4 "$APK" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$OUT/app-release.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose "$OUT/app-release.apk"
          rm "$OUT/aligned.apk"
          cp "$AAB" "$OUT/app-release.aab"
          jarsigner -keystore "$KS" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 "$OUT/app-release.aab" "$KEY_ALIAS"
          jarsigner -verify "$OUT/app-release.aab"
          rm -f "$KS"

      - name: Upload signed release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: app-release-signed
          path: release-out/*
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: env.HAS_KEYSTORE == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-out/app-release.apk release-out/app-release.aab \
            --title "$GITHUB_REF_NAME" --generate-notes
