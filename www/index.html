<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C1A24">
<title>Debug Nile</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1A24;--s1:#132736;--s2:#1A3446;--line:#254357;--tx:#E8F1F2;--mut:#8FA9B5;--gold:#F0B341;--ok:#46C79A;--bad:#FF6B5E;--river:#3C8DAD;--fs:14px;
--top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--bot:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:var(--top)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.ib{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:var(--tx)}
.ib:active{background:var(--s2)}
header h1{font-size:20px;font-weight:800;flex:1}
header h1 span{color:var(--gold)}
#view{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--bot))}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;color:var(--mut);font-size:12px;font-weight:500;min-height:56px}
nav button.on{color:var(--gold);background:var(--s2)}
h2{font-size:18px;font-weight:800;margin:22px 0 10px}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px;background:linear-gradient(160deg,#1B4560,#112B3C);border:1px solid var(--line)}
.hero .rank{font-size:13px;color:var(--mut)}
.hero .lvl{font-size:30px;font-weight:800;margin:2px 0 14px}
.river{height:34px;border-radius:12px;background:#0C1A2488;position:relative;overflow:hidden}
.river i{position:absolute;inset:0 auto 0 0;width:0;background:var(--river);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.river svg{position:absolute;inset:-2px 0 0 0;width:200%;height:100%;stroke:none;fill:#0C1A24;opacity:.0}
.hero .row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mut)}
.chips{display:flex;gap:10px;margin-top:14px}
.chip{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.chip b{display:block;font-size:22px;font-weight:800}
.chip small{color:var(--mut);font-size:12px}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;min-height:68px}
.card:active{background:var(--s2);transform:scale(.99)}
.card .t{flex:1}
.card .t b{display:block;font-size:16px}
.card .t small{color:var(--mut);font-size:13px}
.dot{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--s2);color:var(--gold);font-weight:800}
.dot.done{background:#1D4A41;color:var(--ok)}
.diff{display:flex;gap:3px}.diff i{width:7px;height:7px;border-radius:50%;background:var(--line)}.diff i.f{background:var(--gold)}
.daily{background:linear-gradient(120deg,var(--gold),#E0922C);color:#1A1204;border:0}
.daily .t small{color:#4A3207}.daily .dot{background:#1A120422;color:#1A1204}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px 14px 10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;font-size:11px;color:var(--mut)}
.bars span{width:100%;max-width:26px;border-radius:8px 8px 4px 4px;background:var(--river);min-height:4px}
.bars div.today span{background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .chip{text-align:start;padding:16px}
.ach{display:flex;gap:12px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.ach .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--mut);flex:none}
.ach.on .ic{background:var(--gold);color:#1A1204}
.ach .t{flex:1}.ach b{font-size:16px}.ach small{display:block;color:var(--mut);font-size:13px;margin:2px 0 8px}
.bar{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.set{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;min-height:64px;width:100%;text-align:start}
.set .t{flex:1}.set b{font-size:16px;display:block}.set small{color:var(--mut);font-size:13px}
.sw{width:52px;height:30px;border-radius:15px;background:var(--s2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{inset-inline-start:25px;background:#fff}
.stp{display:flex;align-items:center;gap:6px}.stp button{width:44px;height:44px;border-radius:12px;background:var(--s2);font-size:20px;font-weight:800}
.danger{color:var(--bad)}
/* challenge */
#ch{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:20}
#ch.open{transform:none}
#ch .body{flex:1;overflow-y:auto;padding:0 16px 16px}
.task{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;line-height:1.7;font-size:15px}
.ed{position:relative;height:300px;margin-top:12px;background:#08131B;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ed:focus-within{border-color:var(--river)}
.ed pre,.ed .code{position:absolute;inset:0;margin:0;padding:14px;border:0;font:var(--fs)/1.7 ui-monospace,Menlo,Consolas,monospace;letter-spacing:0;direction:ltr;text-align:left;white-space:pre;overflow-wrap:normal;tab-size:2;-moz-tab-size:2;-webkit-text-size-adjust:100%}
.ed pre{color:#CFE6EA;overflow:hidden;pointer-events:none}
.ed .code{width:100%;height:100%;resize:none;outline:0;overflow:auto;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--gold);-webkit-user-select:text;user-select:text}
.ed .code::selection{background:#3C8DAD88}
#hl .c{color:#6C8795}#hl .s{color:#46C79A}#hl .n{color:#F0B341}#hl .k{color:#78B8D6}#hl .f{color:#C9A7FF}#hl .r{color:#FF9D7A}#hl .p,#hl .o{color:#8FA9B5}
.res{margin-top:12px}
.res div{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:14px;direction:ltr;font-family:ui-monospace,Menlo,monospace}
.res .p{background:#1D4A4188;color:var(--ok)}.res .f{background:#5A262288;color:#FFB4AC}
.hint{margin-top:12px;padding:12px 14px;border-radius:14px;background:#F0B34118;border:1px solid #F0B34155;color:#F7D58F;font-size:14px;line-height:1.6}
.bar2{display:flex;gap:10px;padding:12px 16px calc(12px + var(--bot));border-top:1px solid var(--line);background:var(--s1)}
.btn{flex:1;min-height:52px;border-radius:16px;font-weight:800;font-size:16px;background:var(--s2)}
.btn.main{background:var(--gold);color:#1A1204}
.btn:active{transform:scale(.98)}
/* drawer */
#scrim{position:fixed;inset:0;background:#000A;opacity:0;pointer-events:none;transition:.25s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;right:0;width:min(82vw,330px);background:var(--s1);border-inline-start:1px solid var(--line);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:31;display:flex;flex-direction:column;padding:calc(20px + var(--top)) 16px calc(16px + var(--bot));overflow-y:auto}
#dr.on{transform:none}
#dr .brand{font-size:24px;font-weight:800;margin-bottom:4px}#dr .brand span{color:var(--gold)}
#dr .sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.dbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 12px;border-radius:14px;font-size:16px;font-weight:500;text-align:start}
.dbtn:active{background:var(--s2)}
.app{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--s2);margin-bottom:8px;width:100%;text-align:start}
.app .dot{background:var(--bg)}
.app small{color:var(--mut);display:block;font-size:12px}
.sheet{position:fixed;inset-inline:0;bottom:0;max-height:80dvh;overflow-y:auto;background:var(--s1);border-radius:28px 28px 0 0;border-top:1px solid var(--line);padding:22px 20px calc(22px + var(--bot));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:40}
.sheet.on{transform:none}
.sheet h3{font-size:20px;margin-bottom:10px}.sheet p{color:var(--mut);line-height:1.8;font-size:15px;margin-bottom:10px}
#toast{position:fixed;top:calc(14px + var(--top));inset-inline:16px;margin:auto;max-width:420px;background:var(--gold);color:#1A1204;border-radius:16px;padding:14px 16px;font-weight:700;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:60;text-align:center}
#toast.on{transform:none}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.fl::-webkit-scrollbar{display:none}
.fl button{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);font-size:14px}
.fl .on{background:var(--gold);color:#1A1204;border-color:var(--gold);font-weight:700}
.kb{background:var(--s2);border-radius:14px;padding:12px;margin-bottom:8px}
.kb b{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gold);margin-bottom:4px}
.kb span{color:var(--mut);font-size:14px;line-height:1.7}
.st{display:flex;gap:10px;margin-bottom:10px;font-size:15px;line-height:1.7}
.st i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1A1204;display:grid;place-items:center;font-weight:800;flex:none;font-size:13px;margin-top:2px}
#tr{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--top);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:15}
#tr.open{transform:none}
#tr .body{flex:1;overflow-y:auto;padding:0 16px calc(24px + var(--bot))}
.task code,.opt code,.hint code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;background:#0C1A24;padding:1px 6px;border-radius:6px;font-size:.92em}
.tag{display:inline-block;direction:ltr;background:#3C8DAD33;color:#9AD3EA;border-radius:8px;padding:0 8px;margin-inline-end:8px;font-size:13px;font-weight:700}
.mc{margin-top:12px;direction:ltr;background:#08131B;border:1px solid var(--line);border-radius:16px;padding:12px 0;overflow-x:auto;font:var(--fs)/1.7 ui-monospace,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding-right:14px;min-width:max-content}
.ln i{flex:none;width:36px;text-align:right;padding-right:12px;color:#4C6A7A;font-style:normal;-webkit-user-select:none;user-select:none}
.ln span{color:#CFE6EA}
.mc .c{color:#6C8795}.mc .s{color:#46C79A}.mc .n{color:#F0B341}.mc .k{color:#78B8D6}.mc .f{color:#C9A7FF}.mc .p,.mc .o{color:#8FA9B5}
.opts{margin-top:12px;display:grid;gap:10px}
.opt{display:block;width:100%;text-align:start;min-height:56px;padding:12px 14px;border-radius:16px;background:var(--s1);border:1.5px solid var(--line);font-size:15px;line-height:1.7}
.opt:active{background:var(--s2)}
.opt.sel{border-color:var(--gold);background:var(--s2)}
.opt.good{border-color:var(--ok);background:#1D4A41}
.opt.bad{border-color:var(--bad);background:#5A2622}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="menu" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <h1>Debug <span>Nile</span></h1>
    <button class="ib" id="hdrStreak" aria-label="الأيام المتتالية" style="width:auto;padding:0 12px;gap:6px;color:var(--gold);font-weight:800"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg><span id="sn">0</span></button>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<section id="tr">
  <header>
    <button class="ib" id="trBack" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 id="trT">المسارات</h1>
  </header>
  <div class="body" id="trB"></div>
</section>

<section id="ch">
  <header>
    <button class="ib" id="chBack" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 id="chT" style="font-size:18px"></h1>
    <div class="diff" id="chD"></div>
  </header>
  <div class="body">
    <div class="task" id="chTask"></div>
    <div class="ed" id="edw"><pre id="hl" aria-hidden="true"></pre><textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="محرر الشيفرة"></textarea></div>
    <div class="mc" id="mc" style="display:none"></div>
    <div class="opts" id="opts"></div>
    <div id="hint"></div>
    <div class="res" id="res"></div>
  </div>
  <div class="bar2">
    <button class="btn" id="hintBtn">تلميح</button>
    <button class="btn main" id="runBtn">تحقق من الإصلاح</button>
  </div>
</section>

<div id="scrim"></div>
<aside id="dr"></aside>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>

<script>
/* ===== Data ===== */
const L=a=>a.join("\n");
const CH=[
{id:"sum",fn:"sum",d:1,xp:20,title:"مجموع الأرقام",desc:"الدالة <b>sum</b> يجب أن تُرجع مجموع عناصر المصفوفة، لكنها ترجع <code>NaN</code>. اعثر على الخطأ وأصلحه.",
 code:L(["function sum(arr) {","  let total = 0;","  for (let i = 0; i <= arr.length; i++) {","    total += arr[i];","  }","  return total;","}"]),
 hint:"تحقق من شرط الحلقة: ما هو آخر فهرس صحيح في المصفوفة؟",tests:[[[[1,2,3]],6],[[[]],0],[[[10,-4]],6]]},
{id:"even",fn:"isEven",d:1,xp:20,title:"زوجي أم فردي",desc:"الدالة <b>isEven</b> يجب أن ترجع <code>true</code> للأعداد الزوجية فقط، لكن نتائجها معكوسة.",
 code:L(["function isEven(n) {","  return n % 2 === 1;","}"]),
 hint:"ما باقي قسمة العدد الزوجي على 2؟",tests:[[[4],true],[[7],false],[[0],true]]},
{id:"rev",fn:"reverse",d:1,xp:25,title:"عكس النص",desc:"الدالة <b>reverse</b> يجب أن ترجع النص معكوسًا، لكنها ترجع شيئًا آخر.",
 code:L(["function reverse(s) {","  return s.split('').reverse();","}"]),
 hint:"الناتج الآن مصفوفة. كيف نحوّلها إلى نص؟",tests:[[["nile"],"elin"],[["a"],"a"],[[""],""]]},
{id:"max",fn:"maxOf",d:2,xp:35,title:"أكبر رقم",desc:"الدالة <b>maxOf</b> ترجع أكبر عنصر، لكنها تخطئ مع الأرقام السالبة.",
 code:L(["function maxOf(arr) {","  let m = 0;","  for (const x of arr) {","    if (x > m) m = x;","  }","  return m;","}"]),
 hint:"من أين يجب أن تبدأ المقارنة إذا كانت كل الأرقام أقل من صفر؟",tests:[[[[3,9,2]],9],[[[-5,-2,-9]],-2],[[[-1]],-1]]},
{id:"vow",fn:"countVowels",d:2,xp:40,title:"عدّاد الحروف المتحركة",desc:"الدالة <b>countVowels</b> يجب أن تعدّ كل حروف aeiou في النص، لكنها لا تعدّ إلا واحدًا.",
 code:L(["function countVowels(s) {","  const m = s.match(/[aeiou]/);","  return m ? m.length : 0;","}"]),
 hint:"التعبير النمطي يتوقف عند أول تطابق. أي علامة تجعله يبحث في النص كله؟",tests:[[["banana"],3],[["xyz"],0],[["audio"],4]]},
{id:"fact",fn:"factorial",d:3,xp:60,title:"المضروب",desc:"الدالة <b>factorial</b> تنهار مع الصفر برسالة تجاوز المكدس. أصلحها دون كسر باقي الحالات.",
 code:L(["function factorial(n) {","  if (n === 1) return 1;","  return n * factorial(n - 1);","}"]),
 hint:"ما قيمة المضروب للصفر؟ وما الحالة التي توقف الاستدعاء الذاتي؟",tests:[[[0],1],[[1],1],[[5],120]]},
{id:"last",fn:"getLast",d:1,xp:20,title:"آخر عنصر",desc:"الدالة <b>getLast</b> يجب أن ترجع آخر عنصر في المصفوفة، لكنها ترجع <code>undefined</code>.",
 code:L(["function getLast(arr) {","  return arr[arr.length];","}"]),
 hint:"من أي رقم تبدأ فهارس المصفوفة؟",tests:[[[[1,2,3]],3],[[["a"]],"a"],[[[7,8]],8]]},
{id:"same",fn:"isSame",d:1,xp:20,title:"مقارنة صارمة",desc:"الدالة <b>isSame</b> يجب أن ترجع <code>true</code> فقط إذا تساوت القيمتان في القيمة والنوع. حاليًا <code>isSame(5, '5')</code> ترجع true.",
 code:L(["function isSame(a, b) {","  return a == b;","}"]),
 hint:"هناك معامل مقارنة لا يحوّل الأنواع.",tests:[[[5,"5"],false],[[0,false],false],[[3,3],true],[["a","a"],true]]},
{id:"fizz",fn:"fizzBuzz",d:1,xp:25,title:"فيزبَز",desc:"الدالة <b>fizzBuzz</b> ترجع <code>Fizz</code> لمضاعفات 3، و<code>Buzz</code> لمضاعفات 5، و<code>FizzBuzz</code> لمضاعفات الاثنين معًا، وإلا الرقم نصًا. العدد 15 يعطي نتيجة خاطئة.",
 code:L(["function fizzBuzz(n) {","  if (n % 3 === 0) return 'Fizz';","  if (n % 5 === 0) return 'Buzz';","  if (n % 15 === 0) return 'FizzBuzz';","  return String(n);","}"]),
 hint:"عدد مثل 15 يطابق أول شرط ولا يصل للشرط الأخير. أعد ترتيب الشروط.",tests:[[[15],"FizzBuzz"],[[9],"Fizz"],[[10],"Buzz"],[[7],"7"],[[30],"FizzBuzz"]]},
{id:"avg",fn:"average",d:1,xp:25,title:"المتوسط الحسابي",desc:"الدالة <b>average</b> ترجع متوسط الأرقام، لكنها تعطي <code>NaN</code> مع المصفوفة الفارغة. المطلوب أن ترجع 0 في هذه الحالة.",
 code:L(["function average(arr) {","  let sum = 0;","  for (const x of arr) sum += x;","  return sum / arr.length;","}"]),
 hint:"ماذا ينتج عن 0 ÷ 0؟ تعامل مع الحالة قبل القسمة.",tests:[[[[1,2,3,4]],2.5],[[[]],0],[[[5]],5]]},
{id:"uniq",fn:"unique",d:2,xp:35,title:"إزالة التكرار",desc:"الدالة <b>unique</b> يجب أن ترجع المصفوفة بدون عناصر مكررة مع الحفاظ على الترتيب، لكنها ترجع المكرر فقط.",

const KW=/^(function|return|if|else|for|while|do|const|let|var|new|of|in|typeof|async|await|break|continue|switch|case|default|throw|try|catch|finally|class|extends|this|delete|instanceof|void)$/,LT=/^(true|false|null|undefined|NaN|Infinity)$/;
const TK=/(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:\\.|[^'\\\n])*'?|"(?:\\.|[^"\\\n])*"?|`(?:\\.|[^`\\])*`?)|(\d[\d_]*\.?\d*(?:e[+-]?\d+)?|\.\d+)|([A-Za-z_$][\w$]*)|(\s+)|([\s\S])/y;
const RX=/\/(?![*\/])(?:\\.|\[(?:\\.|[^\]\\\n])*\]|[^\/\\\n\[])+\/[a-z]*/y;
const KWP=/^(def|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|class|try|except|finally|raise|with|pass|break|continue|lambda|yield|global|nonlocal|del|assert|self|async|await)$/,LTP=/^(None|True|False)$/;
const TKP=/(#[^\n]*)|("{3}[\s\S]*?(?:"{3}|$)|'{3}[\s\S]*?(?:'{3}|$)|[fFrRbB]{0,2}(?:'(?:\\.|[^'\\\n])*'?|"(?:\\.|[^"\\\n])*"?))|(\d[\d_]*\.?\d*(?:e[+-]?\d+)?|\.\d+)|([A-Za-z_]\w*)|(\s+)|([\s\S])/y;
function hl(s,py){
  const E=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"),S=(c,t)=>`<span class="${c}">${E(t)}</span>`;
  let o="",i=0,pv="",lw="",m;
  while(i<s.length){
    const T=py?TKP:TK;T.lastIndex=i;m=T.exec(s);if(!m)break;const t=m[0];i+=t.length;
    if(m[1]){o+=S("c",t)}
    else if(m[2]){o+=S("s",t);pv="n";lw=""}
    else if(m[3]){o+=S("n",t);pv="n";lw=""}
    else if(m[4]){
      if((py?KWP:KW).test(t)){o+=S("k",t);pv="k";lw=t}
      else if((py?LTP:LT).test(t)){o+=S("n",t);pv="n";lw=""}
      else{const fn=lw==="function"||lw==="def"||lw==="class"||/^[ \t]*\(/.test(s.slice(i,i+40));o+=fn?S("f",t):E(t);pv="i";lw=""}
    }
    else if(m[5]){o+=t}
    else{
      if(!py&&t==="/"&&pv!=="i"&&pv!=="n"&&pv!==")"&&pv!=="]"){RX.lastIndex=i-1;const r=RX.exec(s);if(r){o+=S("r",r[0]);i=i-1+r[0].length;pv="n";lw="";continue}}
      o+=S(/[{}()\[\];,.]/.test(t)?"p":"o",t);pv=t;lw=""
    }
  }
  return o}

async function run(){

  if(f){

  $("dr").innerHTML=`<div class="brand">Debug <span>Nile</span></div><div class="sub">أصلح الخطأ، اجرِ مع النيل</div>
  <button class="dbtn" data-go="home">${ico("M4 11l8-7 8 7v9H4z")}الرئيسية</button>
  <button class="dbtn" data-go="tracks">${ico("M4 6l5-2 6 2 5-2v14l-5 2-6-2-5 2zM9 4v14M15 6v14")}المسارات</button>
  <button class="dbtn" data-go="kit">${ico("M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z")}حقيبة المنقّح</button>
  <button class="dbtn" data-go="about">${ico("M12 8v.01M11 12h1v5h1M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z")}عن التطبيق</button>
  <h2 style="font-size:15px;color:var(--mut)">المزيد من التطبيقات</h2>
  ${MORE.map((m,i)=>`<button class="app" data-app="${i}"><div class="dot">${m.n[0]}</div><div><b>${m.n}</b><small>${m.d}</small></div></button>`).join("")}`;
}
function drOpen(o){$("dr").classList.toggle("on",o);$("scrim").classList.toggle("on",o||$("sheet").classList.contains("on"))}
function sheet(h){$("sheet").innerHTML=h;$("sheet").classList.add("on");$("scrim").classList.add("on")}
function sheetClose(){$("sheet").classList.remove("on");if(!$("dr").classList.contains("on"))$("scrim").classList.remove("on")}

const STEPS=["أعد إنتاج الخطأ بأصغر مدخل ممكن، فلا يمكن إصلاح ما لا تستطيع تكراره.","اقرأ رسالة الخطأ كاملة: نوعها واسم الدالة ورقم السطر. غالبًا تقول لك المشكلة بوضوح.","اطبع القيم بـ console.log قبل السطر المشبوه وبعده لتعرف أين تخالف الواقع توقعك.","اعزل المشكلة: عطّل أجزاءً من الشيفرة حتى يختفي الخطأ، فتعرف أن آخر جزء عطّلته هو السبب.","غيّر شيئًا واحدًا في كل مرة ثم اختبر، وإلا لن تعرف أي تغيير أصلح المشكلة.","اكتب اختبارًا صغيرًا يغطي الحالة حتى لا يعود الخطأ لاحقًا."];
const ERRS=[["TypeError: Cannot read properties of undefined","تقرأ خاصية من قيمة غير موجودة. افحص القيمة قبل النقطة أو استخدم ?."],["TypeError: x is not a function","تستدعي شيئًا ليس دالة. تحقق من الاسم ومن نوع القيمة."],["ReferenceError: x is not defined","متغير غير معرَّف أو خارج نطاقه أو فيه خطأ إملائي."],["TypeError: Assignment to constant variable","تغيّر متغيرًا معرَّفًا بـ const. استخدم let."],["SyntaxError: Unexpected token","قوس أو فاصلة أو علامة اقتباس ناقصة أو زائدة، غالبًا قبل السطر المذكور."],["RangeError: Maximum call stack size exceeded","استدعاء ذاتي بلا حالة توقف صحيحة."],["NaN","عملية حسابية على undefined أو على نص ليس رقمًا."],["Unhandled promise rejection","Promise فشل ولم يلتقطه أحد. أضف catch أو try/catch حول await."]];
function kit(){sheet(`<h3>حقيبة المنقّح</h3><p>ست خطوات تصلح أي خطأ تقريبًا:</p>`+STEPS.map((t,i)=>`<div class="st"><i>${ar(i+1)}</i><div>${t}</div></div>`).join("")+`<h3 style="margin-top:16px">قاموس رسائل الأخطاء</h3>`+ERRS.map(e=>`<div class="kb"><b>${e[0]}</b><span>${e[1]}</span></div>`).join("")+`<button class="btn main" id="no" style="width:100%;margin-top:8px">حسنًا</button>`);$("sheet").scrollTop=0}
/* ===== Events ===== */
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);let x;
  if(g("#menu")){drawer();drOpen(true)}
  else if(g("#scrim")){drOpen(false);sheetClose()}
  else if(x=g("[data-t]")){tab=x.dataset.t;render()}
  else if(x=g("[data-fl]")){filt=x.dataset.fl;const st=$("view").scrollTop;home();$("view").scrollTop=st}
  else if(g("[data-kit]"))kit();
  else if(x=g("[data-tr]")){trv=x.dataset.tr;drawTr();$("trB").scrollTop=0}
  else if(x=g(".opt")){if(!x.disabled){sel=+x.dataset.o;document.querySelectorAll(".opt").forEach(b=>b.classList.remove("sel","bad"));x.classList.add("sel")}}
  else if(g("#trBack")){if(trv){trv=null;drawTr()}else history.back()}
  else if(x=g("[data-c]"))open(x.dataset.c,x.dataset.tk);
  else if(x=g("[data-s]")){S.set[x.dataset.s]=!S.set[x.dataset.s];save();sett()}
  else if(x=g("[data-f]")){S.set.fs=Math.min(20,Math.max(11,S.set.fs+ +x.dataset.f));document.documentElement.style.setProperty("--fs",S.set.fs+"px");save();sett()}
  else if(g("[data-reset]"))sheet(`<h3>مسح كل التقدم؟</h3><p>سيتم حذف النقاط والإنجازات والإحصائيات نهائيًا ولا يمكن التراجع.</p><div class="bar2" style="padding:0;border:0;background:none"><button class="btn" id="no">إلغاء</button><button class="btn main" id="yes" style="background:var(--bad);color:#fff">مسح التقدم</button></div>`);
  else if(g("#no"))sheetClose();
  else if(g("#yes")){localStorage.removeItem(K);S={solved:{},att:0,ok:0,days:{},xp:0,unl:[],set:S.set};save();sheetClose();render();toast("تم مسح التقدم")}
  else if(x=g("[data-go]")){drOpen(false);if(x.dataset.go==="home"){tab="home";render()}else if(x.dataset.go==="kit")kit();else if(x.dataset.go==="tracks"){trv=null;drawTr();trOpen()}else sheet(`<h3>عن Debug Nile</h3><p>هدف التطبيق أن تصبح قادرًا على التعامل مع معظم المشاكل والأخطاء البرمجية بسهولة بإذن الله. يعطيك شيفرة فيها خطأ وعليك اكتشافه وإصلاحه. كل حل يُختبر فعليًا بحالات اختبار حتى تتأكد أن الإصلاح صحيح.</p><p>الإصدار ١٫٥٫٠</p><p>تطوير: علوش</p>`)}
  else if(x=g("[data-app]")){const m=MORE[x.dataset.app];m.u?window.open(m.u,"_blank"):toast("الرابط قريبًا")}
  else if(g("#chBack"))history.back();
  else if(g("#hintBtn")){hinted=true;$("hint").innerHTML=`<div class="hint">${cur.hint}</div>`}
  else if(g("#runBtn"))run();
});
window.addEventListener("popstate",()=>{if($("sheet").classList.contains("on"))sheetClose();else if($("dr").classList.contains("on"))drOpen(false);else if($("ch").classList.contains("open"))closeCh();else if($("tr").classList.contains("open")){if(trv){trv=null;drawTr();history.pushState({t:1},"")}else closeTr()}});
$("code").addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+"  "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+2;paint()}});
$("code").addEventListener("input",paint);
$("code").addEventListener("scroll",()=>{$("hl").scrollTop=$("code").scrollTop;$("hl").scrollLeft=$("code").scrollLeft});
/* swipe from right edge to open drawer */
let sx=null;document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=(innerWidth-t.clientX<22)?t.clientX:null},{passive:true});
document.addEventListener("touchmove",e=>{if(sx!==null&&sx-e.touches[0].clientX>50){sx=null;drawer();drOpen(true)}},{passive:true});
document.documentElement.style.setProperty("--fs",S.set.fs+"px");
render();
</script>
</body>
</html>
